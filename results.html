<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results & Report Cards | WimpSchool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#e63a2e" />
</head>
<body data-required-role="teacher" data-page="results" class="hide-until-auth">
  <header class="dashboard-header">
    <div class="brand">WimpSchool</div>
    <nav class="dashboard-nav">
      <a href="teacher-dashboard.html">Dashboard</a>
      <a href="attendance.html">Attendance</a>
      <a href="index.html" data-logout class="btn btn-secondary small">Logout</a>
    </nav>
  </header>

  <main class="dashboard-main">
    <section class="dashboard-hero">
      <div>
        <span class="eyebrow">Results</span>
        <h1>Enter scores and generate report cards</h1>
        <p>Capture subject scores, calculate totals, and produce printable report cards.</p>
      </div>
      <div class="dashboard-actions">
        <a href="#enter" class="btn btn-primary">Enter scores</a>
      </div>
    </section>

    <section class="cards-row" id="enter">
      <article class="list-card">
        <h2>Record scores</h2>
        <form id="resultsForm">
          <label>Student ID</label>
          <input type="text" id="resultStudentId" placeholder="WPS/2026/013" />
          <label>Subject</label>
          <input type="text" id="resultSubject" placeholder="Mathematics" />
          <label>Score</label>
          <input type="number" id="resultScore" placeholder="85" />
          <label>Term</label>
          <input type="text" id="resultTerm" placeholder="First term" />
          <button type="submit" class="btn btn-primary">Save result</button>
        </form>
        <p id="resultsStatus" class="form-note"></p>
      </article>
      <article class="list-card">
        <h2>Report cards</h2>
        <p>Generate printable PDFs and provide result history to parents.</p>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config-checker.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Get school ID from session
    function getSavedSchoolId() {
      const raw = sessionStorage.getItem('wimpschoolUser') || localStorage.getItem('wimpschoolUser');
      if (!raw) return null;
      try {
        return JSON.parse(raw)?.schoolId || null;
      } catch (err) {
        return null;
      }
    }

    // Get user info from session
    function getSavedUser() {
      const raw = sessionStorage.getItem('wimpschoolUser') || localStorage.getItem('wimpschoolUser');
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch (err) {
        return null;
      }
    }

    // Wire up the results form
    document.getElementById('resultsForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const statusEl = document.getElementById('resultsStatus');
      if (!statusEl) return;

      const studentCode = document.getElementById('resultStudentId')?.value?.trim();
      const subject = document.getElementById('resultSubject')?.value?.trim();
      const scoreStr = document.getElementById('resultScore')?.value?.trim();
      const term = document.getElementById('resultTerm')?.value?.trim();

      if (!studentCode || !subject || !scoreStr || !term) {
        statusEl.textContent = '❌ Please fill in all fields.';
        statusEl.style.color = '#e63a2e';
        return;
      }

      const score = parseFloat(scoreStr);
      if (isNaN(score) || score < 0 || score > 100) {
        statusEl.textContent = '❌ Score must be a number between 0 and 100.';
        statusEl.style.color = '#e63a2e';
        return;
      }

      const schoolId = getSavedSchoolId();
      const user = getSavedUser();
      
      if (!schoolId || !user?.id) {
        statusEl.textContent = '❌ School or user information not found.';
        statusEl.style.color = '#e63a2e';
        return;
      }

      statusEl.textContent = '⏳ Finding student...';
      statusEl.style.color = '#1a1f5e';

      const client = window.getSupabase ? window.getSupabase() : null;
      if (!client) {
        statusEl.textContent = '❌ Database connection failed.';
        statusEl.style.color = '#e63a2e';
        return;
      }

      // Find student by code
      const { data: students, error: studentError } = await client
        .from('students')
        .select('id')
        .eq('school_id', schoolId)
        .eq('student_code', studentCode)
        .single();

      if (studentError || !students) {
        statusEl.textContent = `❌ Student with code "${studentCode}" not found.`;
        statusEl.style.color = '#e63a2e';
        return;
      }

      // Find teacher ID
      const { data: teachers, error: teacherError } = await client
        .from('teachers')
        .select('id')
        .eq('school_id', schoolId)
        .eq('email', user.email)
        .single();

      if (teacherError || !teachers) {
        statusEl.textContent = '❌ Teacher record not found.';
        statusEl.style.color = '#e63a2e';
        return;
      }

      statusEl.textContent = '⏳ Saving result...';

      const result = await submitResult({
        studentId: students.id,
        teacherId: teachers.id,
        schoolId,
        subject,
        score,
        term
      });

      if (result.error) {
        statusEl.textContent = `❌ Error: ${result.error.message || 'Failed to save result'}`;
        statusEl.style.color = '#e63a2e';
        return;
      }

      statusEl.textContent = `✅ Result saved successfully! ${studentCode} - ${subject}: ${score}`;
      statusEl.style.color = '#10b981';
      
      document.getElementById('resultsForm').reset();
    });
  </script>
</body>
</html>
