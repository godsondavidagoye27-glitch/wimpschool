<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Admin Login | WimpSchool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#e63a2e" />
</head>
<body>
  <header class="auth-header">
    <div class="brand">WimpSchool</div>
    <a href="index.html" class="text-link">Back to Home</a>
  </header>

  <main class="auth-page">
    <section class="auth-panel">
      <span class="eyebrow">Private platform access</span>
      <h1>Super Admin Login</h1>
      <p>Enter your credentials and secret key to access the WimpSchool owner panel.</p>

      <form id="superAdminForm">
        <label>Email</label>
        <input type="email" id="adminEmail" placeholder="owner@wimpschool.com" required />

        <label>Password</label>
        <input type="password" id="adminPassword" placeholder="••••••••" required />

        <label>Secret key</label>
        <input type="password" id="adminSecret" placeholder="Private access code" required />

        <button type="submit" class="btn btn-primary">Access Super Admin Panel</button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config-checker.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
