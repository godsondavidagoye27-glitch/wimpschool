<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Management | WimpSchool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#e63a2e" />
</head>
<body data-required-role="school_admin" data-page="teacher-management">
  <header class="dashboard-header">
    <div class="brand">WimpSchool</div>
    <nav class="dashboard-nav">
      <a href="school-admin-dashboard.html">Dashboard</a>
      <a href="student-management.html">Students</a>
      <a href="admin-settings.html">Settings</a>
      <a href="index.html" data-logout class="btn btn-secondary small">Logout</a>
    </nav>
  </header>

  <main class="dashboard-main">
    <section class="dashboard-hero">
      <div>
        <span class="eyebrow">Teacher management</span>
        <h1>Manage teacher profiles and class assignments</h1>
        <p>Create new teacher accounts, assign subjects, and send email invites automatically.</p>
      </div>
      <div class="dashboard-actions">
        <a href="#create" class="btn btn-primary">Add teacher</a>
      </div>
    </section>

    <section class="cards-row" id="create">
      <article class="list-card">
        <h2>Add new teacher</h2>
        <form id="teacherForm">
          <label>Teacher name</label>
          <input type="text" id="teacherName" placeholder="Name" />
          <label>Email</label>
          <input type="email" id="teacherEmail" placeholder="teacher@example.com" />
          <label>Subjects</label>
          <input type="text" id="teacherSubjects" placeholder="English, Math" />
          <label>Classes</label>
          <input type="text" id="teacherClasses" placeholder="Primary 4A, 5B" />
          <button type="submit" class="btn btn-primary">Send invite</button>
        </form>
        <p id="teacherCreateStatus" class="form-note"></p>
      </article>
      <article class="list-card">
        <h2>Teacher list</h2>
        <div id="teacherList">Search by name, subject, or class to manage assignments.</div>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
