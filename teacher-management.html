<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Management | WimpSchool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#e63a2e" />
</head>
<body data-required-role="school_admin" data-page="teacher-management" class="hide-until-auth">
  <header class="dashboard-header">
    <div class="brand">WimpSchool</div>
    <nav class="dashboard-nav">
      <a href="school-admin-dashboard.html">Dashboard</a>
      <a href="student-management.html">Students</a>
      <a href="admin-settings.html">Settings</a>
      <a href="index.html" data-logout class="btn btn-secondary small">Logout</a>
    </nav>
  </header>

  <main class="dashboard-main">
    <section class="dashboard-hero">
      <div>
        <span class="eyebrow">Teacher management</span>
        <h1>Manage teacher profiles and class assignments</h1>
        <p>Create new teacher accounts, assign subjects, and send email invites automatically.</p>
      </div>
      <div class="dashboard-actions">
        <a href="#create" class="btn btn-primary">Add teacher</a>
      </div>
    </section>

    <section class="cards-row" id="create">
      <article class="list-card">
        <h2>Add new teacher</h2>
        <form id="teacherForm">
          <label>Teacher name</label>
          <input type="text" id="teacherName" placeholder="Name" />
          <label>Email</label>
          <input type="email" id="teacherEmail" placeholder="teacher@example.com" />
          <label>Subjects</label>
          <input type="text" id="teacherSubjects" placeholder="English, Math" />
          <label>Classes</label>
          <input type="text" id="teacherClasses" placeholder="Primary 4A, 5B" />
          <button type="submit" class="btn btn-primary">Send invite</button>
        </form>
        <p id="teacherCreateStatus" class="form-note"></p>
      </article>
      <article class="list-card">
        <h2>Teacher list</h2>
        <div id="teacherList">Search by name, subject, or class to manage assignments.</div>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config-checker.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Get school ID from session
    function getSavedSchoolId() {
      const raw = sessionStorage.getItem('wimpschoolUser') || localStorage.getItem('wimpschoolUser');
      if (!raw) return null;
      try {
        return JSON.parse(raw)?.schoolId || null;
      } catch (err) {
        return null;
      }
    }

    // Fetch and display all teachers for this school
    async function loadTeacherList() {
      const teacherList = document.getElementById('teacherList');
      if (!teacherList) return;

      const client = window.getSupabase ? window.getSupabase() : null;
      const schoolId = getSavedSchoolId();
      
      if (!client || !schoolId) {
        teacherList.innerHTML = '<p>Unable to load teachers.</p>';
        return;
      }

      const { data: teachers, error } = await client
        .from('teachers')
        .select('id, name, email, subjects, classes, account_created')
        .eq('school_id', schoolId)
        .order('created_at', { ascending: false });

      if (error || !teachers?.length) {
        teacherList.innerHTML = '<p>No teachers found. Create one above to get started.</p>';
        return;
      }

      const html = `
        <table style="width: 100%; border-collapse: collapse;">
          <thead>
            <tr style="border-bottom: 2px solid #e63a2e;">
              <th style="text-align: left; padding: 8px;">Name</th>
              <th style="text-align: left; padding: 8px;">Email</th>
              <th style="text-align: left; padding: 8px;">Subjects</th>
              <th style="text-align: left; padding: 8px;">Classes</th>
              <th style="text-align: left; padding: 8px;">Status</th>
            </tr>
          </thead>
          <tbody>
            ${teachers.map(teacher => `
              <tr style="border-bottom: 1px solid #ddd;">
                <td style="padding: 8px;">${teacher.name}</td>
                <td style="padding: 8px; word-break: break-all;">${teacher.email}</td>
                <td style="padding: 8px;">${teacher.subjects || '—'}</td>
                <td style="padding: 8px;">${teacher.classes || '—'}</td>
                <td style="padding: 8px;">${teacher.account_created ? '✅ Active' : '⏳ Invited'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      teacherList.innerHTML = html;
    }

    // Wire up the teacher form
    document.getElementById('teacherForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const statusEl = document.getElementById('teacherCreateStatus');
      if (!statusEl) return;

      const name = document.getElementById('teacherName')?.value?.trim();
      const email = document.getElementById('teacherEmail')?.value?.trim();
      const subjects = document.getElementById('teacherSubjects')?.value?.trim();
      const classes = document.getElementById('teacherClasses')?.value?.trim();

      if (!name || !email) {
        statusEl.textContent = '❌ Please fill in teacher name and email.';
        statusEl.style.color = '#e63a2e';
        return;
      }

      const schoolId = getSavedSchoolId();
      if (!schoolId) {
        statusEl.textContent = '❌ School information not found. Please log in again.';
        statusEl.style.color = '#e63a2e';
        return;
      }

      statusEl.textContent = '⏳ Sending invite...';
      statusEl.style.color = '#1a1f5e';

      const result = await inviteTeacher({
        name,
        email,
        subjects,
        classes,
        schoolId
      });

      if (result.error) {
        statusEl.textContent = `❌ Error: ${result.error.message || 'Failed to send invite'}`;
        statusEl.style.color = '#e63a2e';
        return;
      }

      statusEl.textContent = `✅ Invite sent to "${email}". Token: ${result.token?.slice(0, 8)}...`;
      statusEl.style.color = '#10b981';
      
      document.getElementById('teacherForm').reset();
      await loadTeacherList();
    });

    // Load teacher list when page loads
    window.addEventListener('load', loadTeacherList);
  </script>
</body>
</html>
