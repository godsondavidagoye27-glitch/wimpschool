<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | WimpSchool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#e63a2e" />
</head>
<body>
  <header class="auth-header">
    <div class="brand">WimpSchool</div>
    <a href="login.html" class="text-link">Back to Login</a>
  </header>

  <main class="auth-page">
    <section class="auth-panel">
      <span class="eyebrow">Password recovery</span>
      <h1>Reset your password</h1>
      <p>Enter your email and we’ll send a secure reset link to your inbox.</p>

      <form id="forgotForm">
        <label>Email</label>
        <input type="email" id="resetEmail" placeholder="you@example.com" required />
        <button type="submit" class="btn btn-primary">Send reset link</button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config-checker.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
