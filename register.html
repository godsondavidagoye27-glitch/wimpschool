<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Your School | WimpSchool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#e63a2e" />
</head>
<body>
  <header class="auth-header">
    <div class="brand">WimpSchool</div>
    <a href="index.html" class="text-link">Back to Home</a>
  </header>

  <main class="auth-page">
    <section class="auth-panel wide-panel">
      <span class="eyebrow">School registration</span>
      <h1>Register your school</h1>
      <p>Set up your school, create the first admin account, and start inviting parents.</p>

      <form id="registerForm">
        <fieldset>
          <legend>School details</legend>
          <label>School name</label>
          <input type="text" id="schoolName" placeholder="Example Academy" required />

          <label>School code</label>
          <input type="text" id="schoolCode" placeholder="WPS" required />

          <label>Address</label>
          <input type="text" id="schoolAddress" placeholder="Lagos, Nigeria" required />

          <label>Phone number</label>
          <input type="tel" id="schoolPhone" placeholder="+234 800 000 0000" required />

          <label>School email</label>
          <input type="email" id="schoolEmail" placeholder="admin@example.com" required />

          <label>Upload logo</label>
          <input type="file" id="schoolLogo" accept="image/*" />
        </fieldset>

        <fieldset>
          <legend>Administrator account</legend>
          <label>Admin name</label>
          <input type="text" id="adminName" placeholder="Aisha Bello" required />

          <label>Admin email</label>
          <input type="email" id="adminEmail" placeholder="aisha@example.com" required />

          <label>Password</label>
          <input type="password" id="adminPassword" placeholder="Create a strong password" required />
        </fieldset>

        <fieldset>
          <legend>Subscription plan</legend>
          <select id="subscriptionPlan" required>
            <option value="free">Free Trial</option>
            <option value="basic">Basic</option>
            <option value="standard">Standard</option>
            <option value="premium">Premium</option>
          </select>
        </fieldset>

        <button type="submit" class="btn btn-primary">Create school account</button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config-checker.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
